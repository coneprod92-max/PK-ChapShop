
name: PK-ChapShop - Surveillance

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verifier les pages et ressources
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://coneprod92-max.github.io/PK-ChapShop"

          FILES=(
            "index.html"
            "annonceur.html"
            "store.html"
            "merchant.html"
            "cart.html"
            "tracking.html"
            "admin.html"
            "style.css"
            "app.js"
            "advertiser.js"
            "store.js"
            "merchant.js"
            "cart.js"
            "tracking.js"
            "robots.txt"
            "sitemap.xml"
          )

          ERRORS=0

          for FILE in "${FILES[@]}"; do
            echo "Verification : $FILE"

            if curl --fail --silent --show-error \
              --location --max-time 20 \
              --output /dev/null \
              "$BASE/$FILE"; then
              echo "OK : $FILE"
            else
              echo "ERREUR : $FILE"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "$ERRORS ressource(s) en erreur."
            exit 1
          fi

          echo "Toutes les ressources testees repondent correctement."
