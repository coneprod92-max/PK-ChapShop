<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PK ChapShop — Tout Parakou, dans une seule place</title>
<meta name="description" content="PK ChapShop, la marketplace locale de Parakou : boutiques, restaurants, agences, entreprises, garages et services.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="top">
    <div class="logo">PK <span>ChapShop</span></div>
    <div class="tag">Tout Parakou, dans une seule place.</div>
    <input id="search" class="search" type="search" placeholder="Rechercher une boutique, un restaurant, un service...">
  </div>
</header>

<main>
  <section>
    <div class="section-title"><h2>Catégories</h2></div>
    <div id="categories" class="categories">
      <div class="loading">Chargement...</div>
    </div>
  </section>

  <section class="stores-section">
    <div class="section-title"><h2>Commerces à découvrir</h2></div>
    <div id="stores" class="stores">
      <div class="loading">Chargement des commerces...</div>
    </div>
  </section>
</main>

<footer>
  © 2026 PK ChapShop — Parakou, Bénin
</footer>

<script src="app.js"></script>
</body>
</html>
