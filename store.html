<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Commerce — PK ChapShop</title>

  <link rel="stylesheet" href="style.css">

  <style>
    /* =========================
       GALERIE BOUTIQUE
       ========================= */

    .store-gallery-section {
      margin: 30px 0 40px;
    }

    .store-gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      background: #0f172a;
      min-height: 180px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .08);
    }

    .gallery-item img,
    .gallery-item video {
      display: block;
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .gallery-video {
      grid-column: span 2;
    }

    .gallery-video video {
      height: 280px;
    }

    .gallery-caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 14px;
      color: white;
      background: linear-gradient(
        transparent,
        rgba(0, 0, 0, .82)
      );
      font-size: 13px;
      font-weight: 700;
    }

    .gallery-empty {
      padding: 25px;
      background: #f8fafc;
      border-radius: 18px;
      color: #64748b;
      text-align: center;
    }

    @media (max-width: 600px) {

      .store-gallery {
        grid-template-columns: 1fr 1fr;
      }

      .gallery-item img {
        height: 170px;
      }

      .gallery-video {
        grid-column: span 2;
      }

      .gallery-video video {
        height: 240px;
      }

    }
  </style>
</head>

<body>

<header class="header">

  <a href="index.html" class="logo">
    PK <span>ChapShop</span>
  </a>

  <a href="cart.html" class="cart-link">
    🛒 <span id="cartCount">0</span>
  </a>

</header>


<main class="container store-page">

  <a href="index.html" class="back-link">
    ← Retour aux commerces
  </a>


  <!-- =========================
       INFORMATIONS BOUTIQUE
       ========================= -->

  <section
    id="storeInfo"
    class="store-hero"
  >

    <div class="loading">
      Chargement du commerce...
    </div>

  </section>


  <!-- =========================
       GALERIE
       ========================= -->

  <section class="store-gallery-section">

    <div class="section-title">

      <div>

        <small>
          VISITEZ LA BOUTIQUE
        </small>

        <h2>
          📸 Galerie
        </h2>

      </div>

    </div>


    <div
      id="storeGallery"
      class="store-gallery"
    >

    </div>

  </section>


  <!-- =========================
       PRODUITS
       ========================= -->

  <section>

    <div class="section-title">

      <div>

        <small>
          CATALOGUE
        </small>

        <h2>
          Produits
        </h2>

      </div>

    </div>


    <div
      id="products"
      class="products-grid"
    >

      <div class="loading">
        Chargement des produits...
      </div>

    </div>

  </section>

</main>


<div
  id="toast"
  class="toast"
></div>


<script src="store.js"></script>

</body>
</html>
