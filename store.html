
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102d22">
  <meta name="description" content="Découvrez les commerces, leurs produits et leurs galeries sur PK-ChapShop.">

  <title>Boutique — PK-ChapShop</title>
  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --shop-green: #102d22;
      --shop-green-light: #1d4936;
      --shop-gold: #d5b36a;
      --shop-cream: #f7f5ef;
      --shop-white: #ffffff;
      --shop-text: #243329;
      --shop-muted: #718075;
      --shop-border: #e7e8df;
      --shop-shadow: 0 16px 45px rgba(16, 45, 34, .09);
    }

    body {
      background: var(--shop-cream);
      color: var(--shop-text);
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 15px clamp(16px, 5vw, 72px);
      background: rgba(16, 45, 34, .97);
      border-bottom: 1px solid rgba(213, 179, 106, .35);
      box-shadow: 0 5px 22px rgba(0, 0, 0, .08);
      backdrop-filter: blur(12px);
    }

    .header .logo {
      color: #fff;
      font-weight: 900;
      font-size: 1.3rem;
      text-decoration: none;
      letter-spacing: -.5px;
    }

    .header .logo span {
      color: var(--shop-gold);
    }

    .cart-link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 15px;
      color: var(--shop-green);
      background: var(--shop-gold);
      border-radius: 999px;
      font-weight: 800;
      text-decoration: none;
      transition: transform .2s ease;
    }

    .cart-link:hover {
      transform: translateY(-2px);
    }

    .store-page {
      width: min(1180px, 92%);
      margin: 0 auto;
      padding: 28px 0 72px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      color: var(--shop-green);
      font-weight: 750;
      text-decoration: none;
    }

    .back-link:hover {
      color: #9a762f;
    }

    .store-hero {
      overflow: hidden;
      background: var(--shop-white);
      border: 1px solid var(--shop-border);
      border-radius: 25px;
      box-shadow: var(--shop-shadow);
    }

    .store-cover-large {
      min-height: 240px;
      background:
        linear-gradient(120deg, rgba(16, 45, 34, .2), rgba(16, 45, 34, .65)),
        linear-gradient(135deg, #315b43, #102d22);
      background-position: center;
      background-size: cover;
    }

    .store-details {
      padding: clamp(22px, 4vw, 40px);
    }

    .store-details h1 {
      margin: 0 0 14px;
      color: var(--shop-green);
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .store-details > p {
      max-width: 760px;
      margin: 0 0 22px;
      color: var(--shop-muted);
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .store-location {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 12px;
      color: var(--shop-text);
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .store-location a {
      color: var(--shop-green-light);
      font-weight: 750;
      text-decoration-color: var(--shop-gold);
      text-underline-offset: 4px;
      overflow-wrap: anywhere;
    }

    .store-gallery-section,
    .store-products-section {
      margin-top: 48px;
    }

    .section-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .section-title small {
      display: block;
      margin-bottom: 8px;
      color: #9a762f;
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .section-title h2 {
      margin: 0;
      color: var(--shop-green);
      font-size: clamp(1.5rem, 3vw, 2.1rem);
    }

    .store-gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .gallery-item {
      position: relative;
      min-width: 0;
      min-height: 180px;
      overflow: hidden;
      isolation: isolate;
      background: var(--shop-green);
      border: 1px solid var(--shop-border);
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(16, 45, 34, .07);
    }

    .gallery-item img,
    .gallery-item video {
      display: block;
      width: 100%;
      height: 245px;
      object-fit: cover;
    }

    .gallery-item img {
      transition: transform .4s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.04);
    }

    .gallery-video {
      grid-column: span 2;
    }

    .gallery-video video {
      height: 320px;
      background: #000;
    }

    .gallery-caption {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 35px 16px 15px;
      color: #fff;
      background: linear-gradient(transparent, rgba(0, 0, 0, .83));
      font-size: .9rem;
      font-weight: 750;
      overflow-wrap: anywhere;
      pointer-events: none;
    }

    .gallery-empty,
    .loading,
    .empty {
      padding: 26px;
      color: var(--shop-muted);
      background: var(--shop-white);
      border: 1px solid var(--shop-border);
      border-radius: 16px;
      text-align: center;
      line-height: 1.7;
    }

    .gallery-empty {
      grid-column: 1 / -1;
    }

    .empty.error {
      color: #a83232;
      background: #fff8f7;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .product-card {
      min-width: 0;
      overflow: hidden;
      background: var(--shop-white);
      border: 1px solid var(--shop-border);
      border-radius: 21px;
      box-shadow: 0 10px 30px rgba(16, 45, 34, .06);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shop-shadow);
    }

    .product-image {
      height: 230px;
      overflow: hidden;
      background: #edf0e8;
    }

    .product-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .35s ease;
    }

    .product-card:hover .product-image img {
      transform: scale(1.035);
    }

    .product-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 180px;
      padding: 20px;
      color: var(--shop-muted);
      background: #edf0e8;
      text-align: center;
      line-height: 1.5;
    }

    .product-image .product-placeholder {
      height: 100%;
    }

    .product-content {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      padding: 20px;
    }

    .product-content h3 {
      margin: 0;
      color: var(--shop-green);
      font-size: 1.08rem;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .product-content p {
      margin: 0;
      color: var(--shop-muted);
      font-size: .92rem;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .price {
      color: var(--shop-green);
      font-size: 1.25rem;
      font-weight: 900;
    }

    .add-button {
      width: 100%;
      min-height: 46px;
      padding: 12px 16px;
      color: var(--shop-green);
      background: var(--shop-gold);
      border: 1px solid #c6a253;
      border-radius: 12px;
      font: inherit;
      font-weight: 850;
      cursor: pointer;
      transition: background .2s ease, transform .2s ease;
    }

    .add-button:hover {
      background: #e4c77f;
      transform: translateY(-1px);
    }

    .add-button:focus-visible,
    a:focus-visible {
      outline: 3px solid #d5b36a;
      outline-offset: 3px;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 50;
      max-width: min(360px, calc(100vw - 40px));
      padding: 15px 20px;
      color: #fff;
      background: var(--shop-green);
      border: 1px solid var(--shop-gold);
      border-radius: 14px;
      box-shadow: var(--shop-shadow);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 850px) {
      .products-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .store-gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .gallery-video {
        grid-column: span 2;
      }
    }

    @media (max-width: 560px) {
      .header {
        padding: 13px 4%;
      }

      .header .logo {
        font-size: 1.12rem;
      }

      .store-page {
        width: 92%;
        padding-top: 20px;
      }

      .store-cover-large {
        min-height: 170px;
      }

      .store-details {
        padding: 22px 18px;
      }

      .store-gallery-section,
      .store-products-section {
        margin-top: 36px;
      }

      .products-grid {
        grid-template-columns: 1fr;
        gap: 17px;
      }

      .product-image {
        height: 240px;
      }

      .store-gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .gallery-item {
        min-height: 145px;
        border-radius: 14px;
      }

      .gallery-item img {
        height: 165px;
      }

      .gallery-video video {
        height: 220px;
      }

      .gallery-caption {
        padding: 28px 10px 11px;
        font-size: .78rem;
      }

      .section-title {
        margin-bottom: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <a href="index.html" class="logo" aria-label="PK-ChapShop, accueil">
      PK <span>ChapShop</span>
    </a>

    <a href="cart.html" class="cart-link" aria-label="Voir le panier">
      🛒 Panier <span id="cartCount">0</span>
    </a>
  </header>

  <main class="container store-page">
    <a href="index.html" class="back-link">← Retour aux commerces</a>

    <section id="storeInfo" class="store-hero" aria-live="polite">
      <div class="loading">Chargement du commerce...</div>
    </section>

    <section class="store-gallery-section">
      <div class="section-title">
        <div>
          <small>IMMERSION DANS LE COMMERCE</small>
          <h2>📸 Galerie</h2>
        </div>
      </div>

      <div id="storeGallery" class="store-gallery" aria-live="polite"></div>
    </section>

    <section class="store-products-section">
      <div class="section-title">
        <div>
          <small>DÉCOUVREZ NOS ARTICLES</small>
          <h2>Nos produits</h2>
        </div>
      </div>

      <div id="products" class="products-grid" aria-live="polite">
        <div class="loading">Chargement des produits...</div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="store.js?v=20261029"></script>
</body>
</html>
