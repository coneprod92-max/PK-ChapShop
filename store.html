
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102d22">
  <meta name="description" content="Découvrez les produits, services et offres de nos commerçants sur PK-ChapShop.">
  <title>Boutique — PK-ChapShop</title>
  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --shop-green:#102d22;
      --shop-green-light:#1d4936;
      --shop-gold:#d5b36a;
      --shop-cream:#f7f6f0;
      --shop-text:#243329;
      --shop-muted:#718075;
      --shop-border:#e7e8df;
      --shop-shadow:0 16px 45px rgba(16,45,34,.09);
    }

    body { background:var(--shop-cream); color:var(--shop-text); }

    .header {
      position:sticky;top:0;z-index:30;
      display:flex;align-items:center;justify-content:space-between;
      gap:14px;padding:14px clamp(16px,5vw,72px);
      background:rgba(16,45,34,.97);
      border-bottom:1px solid rgba(213,179,106,.35);
      box-shadow:0 5px 22px rgba(0,0,0,.08);
      backdrop-filter:blur(12px);
    }

    .header .logo {
      color:#fff;font-weight:900;font-size:1.3rem;
      text-decoration:none;letter-spacing:-.5px;
    }
    .header .logo span { color:var(--shop-gold); }

    .cart-link {
      display:inline-flex;align-items:center;gap:8px;
      padding:10px 15px;color:var(--shop-green);
      background:var(--shop-gold);border-radius:999px;
      font-weight:850;text-decoration:none;
    }

    .store-page { width:min(1180px,92%);margin:auto;padding:25px 0 70px; }
    .back-link {
      display:inline-flex;gap:8px;margin-bottom:20px;
      color:var(--shop-green);font-weight:800;text-decoration:none;
    }

    .store-hero {
      overflow:hidden;background:white;border:1px solid var(--shop-border);
      border-radius:25px;box-shadow:var(--shop-shadow);
    }

    .store-cover-large {
      position:relative;min-height:290px;
      display:flex;align-items:flex-end;
      padding:25px;
      background:linear-gradient(135deg,#315b43,#102d22);
      background-position:center;background-size:cover;
      isolation:isolate;
    }

    .store-cover-large::after {
      content:"";position:absolute;inset:0;z-index:-1;
      background:linear-gradient(0deg,rgba(5,25,17,.82),rgba(5,25,17,.05) 75%);
    }

    .cover-label {
      color:#fff;font-size:.76rem;font-weight:850;
      letter-spacing:2px;text-transform:uppercase;
    }

    .store-details { padding:0 clamp(18px,4vw,38px) 30px; }

    .store-brand-row {
      display:flex;align-items:flex-end;gap:20px;
      margin-top:-58px;position:relative;z-index:2;
    }

    .store-logo {
      width:116px;height:116px;flex-shrink:0;
      display:grid;place-items:center;overflow:hidden;
      border:5px solid white;border-radius:23px;
      background:#edf1e9;color:var(--shop-green);
      box-shadow:0 8px 25px rgba(0,0,0,.15);
      font-size:38px;font-weight:900;
    }

    .store-logo img { width:100%;height:100%;object-fit:cover; }

    .store-brand-text { padding-bottom:8px;min-width:0; }
    .store-brand-text h1 {
      margin:0;color:var(--shop-green);
      font-size:clamp(1.65rem,4vw,2.5rem);
      line-height:1.15;overflow-wrap:anywhere;
    }

    .store-category {
      display:inline-flex;margin-top:9px;padding:7px 12px;
      border:1px solid #ead9ac;border-radius:999px;
      background:#fbf7e9;color:#8c6826;
      font-size:.78rem;font-weight:850;
    }

    .store-description {
      max-width:820px;margin:24px 0 18px;
      color:var(--shop-muted);line-height:1.85;
      overflow-wrap:anywhere;
    }

    .store-status-row {
      display:flex;flex-wrap:wrap;gap:9px;margin:18px 0;
    }

    .store-badge {
      display:inline-flex;align-items:center;gap:7px;
      padding:9px 12px;border:1px solid var(--shop-border);
      border-radius:10px;background:#fafbf8;
      color:var(--shop-text);font-size:.82rem;font-weight:800;
    }

    .store-badge.open { color:#176b3b;background:#edf8ef;border-color:#cce8d2; }
    .store-badge.closed { color:#a33b32;background:#fff1ef;border-color:#f1d0ca; }

    .store-contact {
      display:flex;flex-wrap:wrap;gap:12px;margin-top:22px;
    }

    .contact-button {
      display:inline-flex;align-items:center;justify-content:center;
      gap:9px;min-height:47px;padding:12px 18px;
      border-radius:12px;text-decoration:none;font-weight:850;
      transition:transform .2s,filter .2s;
    }
    .contact-button:hover { transform:translateY(-2px);filter:brightness(1.04); }
    .contact-whatsapp { background:#167b45;color:white; }
    .contact-phone { background:var(--shop-green);color:white; }
    .contact-address { background:#f4f1e6;color:#745a25;border:1px solid #e8d8ad; }

    .store-gallery-section,.store-products-section { margin-top:48px; }

    .section-title {
      display:flex;align-items:end;justify-content:space-between;
      gap:15px;margin-bottom:20px;
    }
    .section-title small {
      display:block;margin-bottom:7px;color:#9a762f;
      font-size:.72rem;font-weight:900;letter-spacing:2px;
    }
    .section-title h2 {
      margin:0;color:var(--shop-green);
      font-size:clamp(1.5rem,3vw,2.1rem);
    }

    .store-gallery {
      display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
    }

    .gallery-item {
      position:relative;min-width:0;min-height:180px;
      overflow:hidden;background:var(--shop-green);
      border:1px solid var(--shop-border);border-radius:18px;
    }
    .gallery-item img,.gallery-item video {
      display:block;width:100%;height:245px;object-fit:cover;
    }
    .gallery-item img { transition:transform .35s; }
    .gallery-item:hover img { transform:scale(1.04); }
    .gallery-video { grid-column:span 2; }
    .gallery-video video { height:320px;background:#000; }

    .gallery-caption {
      position:absolute;right:0;bottom:0;left:0;
      padding:32px 14px 13px;color:white;
      background:linear-gradient(transparent,rgba(0,0,0,.8));
      font-size:.85rem;font-weight:750;pointer-events:none;
    }

    .products-grid {
      display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;
    }

    .product-card {
      min-width:0;overflow:hidden;background:white;
      border:1px solid var(--shop-border);border-radius:19px;
      box-shadow:0 8px 25px rgba(16,45,34,.055);
      transition:transform .2s,box-shadow .2s;
    }
    .product-card:hover { transform:translateY(-4px);box-shadow:var(--shop-shadow); }

    .product-image {
      height:230px;overflow:hidden;background:#edf0e8;
    }
    .product-image img {
      display:block;width:100%;height:100%;object-fit:cover;
      transition:transform .35s;
    }
    .product-card:hover .product-image img { transform:scale(1.04); }

    .product-placeholder {
      display:grid;place-items:center;min-height:180px;
      padding:20px;background:#edf0e8;color:var(--shop-muted);
      text-align:center;
    }
    .product-image .product-placeholder { height:100%; }

    .product-content {
      display:flex;flex-direction:column;gap:12px;padding:19px;
    }
    .product-content h3 {
      margin:0;color:var(--shop-green);font-size:1.08rem;line-height:1.4;
      overflow-wrap:anywhere;
    }
    .product-content p {
      margin:0;color:var(--shop-muted);font-size:.9rem;line-height:1.65;
      overflow-wrap:anywhere;
    }
    .price { color:var(--shop-green);font-size:1.3rem;font-weight:950; }

    .add-button {
      width:100%;min-height:47px;padding:12px 15px;
      color:var(--shop-green);background:var(--shop-gold);
      border:1px solid #c6a253;border-radius:12px;
      font:inherit;font-weight:900;cursor:pointer;
    }
    .add-button:hover { background:#e4c77f; }

    .loading,.empty,.gallery-empty {
      grid-column:1/-1;padding:26px;color:var(--shop-muted);
      background:white;border:1px solid var(--shop-border);
      border-radius:16px;text-align:center;line-height:1.7;
    }
    .empty.error { color:#a83232;background:#fff8f7; }

    .toast {
      position:fixed;right:18px;bottom:18px;z-index:60;
      max-width:min(360px,calc(100vw - 36px));
      padding:14px 19px;color:white;background:var(--shop-green);
      border:1px solid var(--shop-gold);border-radius:13px;
      box-shadow:var(--shop-shadow);opacity:0;
      transform:translateY(12px);pointer-events:none;
      transition:opacity .2s,transform .2s;
    }
    .toast.show { opacity:1;transform:translateY(0); }

    a:focus-visible,button:focus-visible {
      outline:3px solid var(--shop-gold);outline-offset:3px;
    }

    @media(max-width:850px) {
      .products-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .store-gallery { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }

    @media(max-width:560px) {
      .header { padding:12px 4%; }
      .header .logo { font-size:1.1rem; }
      .store-page { width:92%;padding-top:18px; }
      .store-cover-large { min-height:205px;padding:17px; }
      .store-details { padding:0 16px 23px; }
      .store-brand-row { gap:12px;margin-top:-43px;align-items:flex-end; }
      .store-logo { width:86px;height:86px;border-width:4px;border-radius:17px;font-size:29px; }
      .store-brand-text { padding-bottom:4px; }
      .store-brand-text h1 { font-size:1.35rem; }
      .store-category { font-size:.69rem;padding:6px 9px; }
      .store-description { margin-top:19px;font-size:.91rem; }
      .store-status-row { gap:7px; }
      .store-badge { font-size:.74rem;padding:8px 9px; }
      .store-contact { display:grid;grid-template-columns:1fr;gap:9px; }
      .contact-button { width:100%; }
      .store-gallery-section,.store-products-section { margin-top:36px; }
      .store-gallery { grid-template-columns:repeat(2,minmax(0,1fr));gap:9px; }
      .gallery-item { min-height:135px;border-radius:13px; }
      .gallery-item img { height:155px; }
      .gallery-video video { height:210px; }
      .gallery-caption { padding:25px 9px 10px;font-size:.72rem; }
      .products-grid { grid-template-columns:1fr;gap:15px; }
      .product-image { height:235px; }
      .product-content { padding:17px; }
      .section-title { margin-bottom:15px; }
    }

    @media(prefers-reduced-motion:reduce) {
      *,*::before,*::after {
        scroll-behavior:auto!important;
        transition-duration:.01ms!important;
        animation-duration:.01ms!important;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <a href="index.html" class="logo" aria-label="PK-ChapShop, accueil">
      PK <span>ChapShop</span>
    </a>
    <a href="cart.html" class="cart-link" aria-label="Voir le panier">
      🛒 Panier <span id="cartCount">0</span>
    </a>
  </header>

  <main class="store-page">
    <a href="index.html" class="back-link">← Retour aux commerces</a>

    <section id="storeInfo" class="store-hero" aria-live="polite">
      <div class="loading">Chargement du commerce...</div>
    </section>

    <section class="store-gallery-section">
      <div class="section-title">
        <div>
          <small>DÉCOUVREZ NOTRE UNIVERS</small>
          <h2>📸 Galerie du commerce</h2>
        </div>
      </div>
      <div id="storeGallery" class="store-gallery" aria-live="polite"></div>
    </section>

    <section class="store-products-section">
      <div class="section-title">
        <div>
          <small>NOTRE SÉLECTION</small>
          <h2>🛍️ Nos produits</h2>
        </div>
      </div>
      <div id="products" class="products-grid" aria-live="polite">
        <div class="loading">Chargement des produits...</div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="store.js?v=20261031"></script>
</body>
</html>
